<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ColodelBot · Assistente Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
</head>
<body>

  <canvas id="particleField" class="particle-field" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar__left">
      <button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="Abrir conversas">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" aria-hidden="true">
          <path d="M4 6H20M4 12H20M4 18H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="topbar__brand">
        <span class="topbar__dot" aria-hidden="true"></span>
        <span class="topbar__name">ColodelBot</span>
        <span class="topbar__tag">assistente virtual</span>
      </div>
    </div>
    <div class="topbar__right">
      <button class="icon-btn" id="themeToggle" aria-label="Alternar tema claro/escuro" title="Tema claro/escuro">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" id="themeIcon" aria-hidden="true">
          <path d="M12 3V5M12 19V21M5 12H3M21 12H19M6.3 6.3L4.9 4.9M19.1 19.1L17.7 17.7M6.3 17.7L4.9 19.1M19.1 4.9L17.7 6.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/>
        </svg>
      </button>
      <button class="icon-btn" id="settingsToggle" aria-label="Configurações" title="Configurações">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true">
          <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5A3.5 3.5 0 0 0 12 15.5Z" stroke="currentColor" stroke-width="1.6"/>
          <path d="M19.4 13.5C19.6 12.5 19.6 11.5 19.4 10.5L21.3 9L19.8 6.4L17.6 7.2C16.9 6.5 16 5.9 15.1 5.6L14.7 3.3H11.3L10.9 5.6C10 5.9 9.1 6.5 8.4 7.2L6.2 6.4L4.7 9L6.6 10.5C6.4 11.5 6.4 12.5 6.6 13.5L4.7 15L6.2 17.6L8.4 16.8C9.1 17.5 10 18.1 10.9 18.4L11.3 20.7H14.7L15.1 18.4C16 18.1 16.9 17.5 17.6 16.8L19.8 17.6L21.3 15L19.4 13.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="topbar__status" id="status-pill">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">ONLINE</span>
      </div>
    </div>
  </header>

  <div class="shell">

    <!-- ===================== SIDEBAR DE CONVERSAS ===================== -->
    <aside class="sidebar" id="sidebar">
      <button class="new-chat" id="newChatButton">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
          <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Nova conversa
      </button>

      <div class="sidebar__search">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
          <path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Buscar conversas..." autocomplete="off" />
      </div>

      <button class="select-mode-btn" id="selectModeButton">Selecionar</button>

      <div class="sidebar__scroll" id="sidebarScroll">
        <div class="sidebar__section" id="pinnedSection">
          <div class="sidebar__section-title">FIXADAS</div>
          <div class="sidebar__list" id="pinnedList"></div>
        </div>

        <div class="sidebar__section">
          <div class="sidebar__section-title">CONVERSAS</div>
          <div class="sidebar__list" id="conversationList"></div>
        </div>

        <div class="sidebar__section" id="trashSection">
          <button class="sidebar__section-title sidebar__section-title--toggle" id="trashToggle">
            <span>LIXEIRA</span>
            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" id="trashChevron"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="sidebar__list" id="trashList" hidden></div>
        </div>
      </div>

      <div class="bulk-bar" id="bulkBar" hidden>
        <span id="bulkCount">0 selecionadas</span>
        <button id="bulkDeleteButton">Excluir</button>
        <button id="bulkCancelButton">Cancelar</button>
      </div>

      <div class="sidebar__foot">
        <span class="sidebar__foot-dot" aria-hidden="true"></span>
        salvo neste navegador
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ===================== CONSOLE PRINCIPAL ===================== -->
    <main class="console">

      <!-- ===================== PAINEL DO ROBÔ ===================== -->
      <section class="robot-panel" aria-label="ColodelBot, assistente virtual">
        <div class="dome" id="dome">

          <svg class="circuit" viewBox="0 0 240 240" aria-hidden="true">
            <path class="circuit__line" d="M20 60 H70 V30" />
            <path class="circuit__line" d="M220 70 H180 V110" />
            <path class="circuit__line" d="M25 190 H75 V160" />
            <path class="circuit__line" d="M215 185 H165 V150" />
            <circle class="circuit__node" cx="70" cy="30" r="3" />
            <circle class="circuit__node" cx="180" cy="110" r="3" />
            <circle class="circuit__node" cx="75" cy="160" r="3" />
            <circle class="circuit__node" cx="165" cy="150" r="3" />
          </svg>

          <div class="dome__ring dome__ring--outer" aria-hidden="true"></div>
          <div class="dome__ring dome__ring--scan" id="scanRing" aria-hidden="true"></div>
          <div class="dome__hex" aria-hidden="true"></div>

          <div class="orbit orbit--1" aria-hidden="true">
            <div class="badge badge--code" title="Código">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M9 6L3 12L9 18M15 6L21 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
          <div class="orbit orbit--2" aria-hidden="true">
            <div class="badge badge--braces" title="Dados">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M8 3C6 3 5.5 4 5.5 6V9C5.5 10.5 5 11 3.5 11.5C5 12 5.5 12.5 5.5 14V17C5.5 19 6 20 8 20M16 3C18 3 18.5 4 18.5 6V9C18.5 10.5 19 11 20.5 11.5C19 12 18.5 12.5 18.5 14V17C18.5 19 18 20 16 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
          <div class="orbit orbit--3" aria-hidden="true">
            <div class="badge badge--terminal" title="Terminal">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M4 5H20V19H4V5Z" stroke="currentColor" stroke-width="1.6"/><path d="M7 9L10 12L7 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 15H16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </div>
          </div>

          <button class="robot" id="robotButton" aria-label="Cutucar o ColodelBot">
            <svg viewBox="0 0 240 240" class="robot__svg" id="robotSvg" aria-hidden="true">

              <ellipse cx="120" cy="222" rx="62" ry="9" fill="#04101c" opacity="0.35" />

              <path class="robot__body" d="M58 226 C 54 176, 70 150, 120 150 C 170 150, 186 176, 182 226 Z" />

              <line class="robot__antenna-stem" x1="120" y1="46" x2="120" y2="22" />
              <circle class="robot__antenna-tip" cx="120" cy="16" r="6" />

              <circle class="robot__ear" cx="186" cy="98" r="20" />
              <circle class="robot__ear-ring" cx="186" cy="98" r="13" />
              <circle class="robot__ear-glow" cx="186" cy="98" r="6" />

              <circle class="robot__ear" cx="54" cy="98" r="14" />

              <rect class="robot__head" x="46" y="40" width="148" height="118" rx="46" />

              <rect class="robot__face" x="68" y="64" width="104" height="72" rx="26" />

              <path class="robot__brow robot__brow--l" id="browL" d="M88 84 L104 90" />
              <path class="robot__brow robot__brow--r" id="browR" d="M152 84 L136 90" />

              <g id="eyes">
                <g id="eyeGroupL">
                  <ellipse class="robot__eye" id="eyeL" cx="100" cy="100" rx="10" ry="14" />
                </g>
                <g id="eyeGroupR">
                  <ellipse class="robot__eye" id="eyeR" cx="140" cy="100" rx="10" ry="14" />
                </g>
              </g>

              <path class="robot__mouth" id="mouth" d="M104 116 Q120 128 136 116" />

              <text class="robot__zzz" id="zzz1" x="172" y="52">z</text>
              <text class="robot__zzz robot__zzz--big" id="zzz2" x="184" y="36">Z</text>
            </svg>

            <div class="robot__pulse" id="robotPulse" aria-hidden="true"></div>
            <div class="robot__sparks" id="robotSparks" aria-hidden="true"></div>
          </button>

          <div class="platform" aria-hidden="true">
            <div class="platform__ring"></div>
            <div class="platform__beam"></div>
          </div>
        </div>

        <p class="robot__speech" id="robotSpeech">
          Oi! Eu sou o ColodelBot 👋 Pode me perguntar qualquer coisa.
        </p>

        <div class="hud" id="hud">
          <div class="hud__row">
            <span class="hud__label">SESSÃO</span>
            <span class="hud__value" id="hudSession">--</span>
          </div>
          <div class="hud__row">
            <span class="hud__label">MENSAGENS</span>
            <span class="hud__value" id="hudMessages">0</span>
          </div>
          <div class="hud__row">
            <span class="hud__label">MODELO</span>
            <span class="hud__value">gemini-2.5-flash</span>
          </div>
          <div class="hud__row">
            <span class="hud__label">STATUS</span>
            <span class="hud__value" id="hudStatus">IDLE</span>
          </div>
        </div>
      </section>

      <!-- ===================== PAINEL DO CHAT ===================== -->
      <section class="chat-panel" aria-label="Conversa com o ColodelBot">

        <div class="chat-log" id="chatLog"></div>

        <div class="suggestions" id="suggestions">
          <button class="chip" data-msg="Explique o que é uma API REST">O que é uma API REST?</button>
          <button class="chip" data-msg="Quem foi campeão da última Copa do Mundo?">Última Copa do Mundo?</button>
          <button class="chip" data-msg="Me dê uma dica pra produtividade estudando programação">Dica de produtividade</button>
          <button class="chip" data-msg="Me conte uma curiosidade sobre o universo">Curiosidade do universo</button>
        </div>

        <div class="image-preview" id="imagePreview" hidden>
          <img id="imagePreviewImg" alt="Prévia da imagem anexada" />
          <button id="imagePreviewRemove" aria-label="Remover imagem">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none"><path d="M6 6L18 18M6 18L18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>

        <form class="composer" id="composerForm">
          <input type="file" id="imageInput" accept="image/*" hidden />
          <button type="button" class="icon-btn composer__attach" id="attachButton" aria-label="Anexar imagem" title="Anexar imagem">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
              <path d="M21 12.5L12.5 21C10 23.5 6 23.5 3.5 21C1 18.5 1 14.5 3.5 12L13 2.5C14.7 0.8 17.5 0.8 19.2 2.5C20.9 4.2 20.9 7 19.2 8.7L10.2 17.7C9.3 18.6 7.9 18.6 7 17.7C6.1 16.8 6.1 15.4 7 14.5L15 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <textarea
            id="messageInput"
            class="composer__input"
            placeholder="Pergunte alguma coisa ao ColodelBot..."
            rows="1"
            maxlength="4000"
            autocomplete="off"
          ></textarea>
          <button type="submit" class="composer__send" id="sendButton" aria-label="Enviar mensagem">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
              <path d="M3 11.5L20.5 3L12.5 20.5L10.5 13L3 11.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
          </button>
        </form>
      </section>

    </main>
  </div>

  <!-- ===================== MODAL DE CONFIGURAÇÕES ===================== -->
  <div class="modal-backdrop" id="settingsBackdrop" hidden>
    <div class="modal" role="dialog" aria-label="Configurações">
      <div class="modal__head">
        <h2>Configurações</h2>
        <button class="icon-btn" id="settingsClose" aria-label="Fechar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M6 6L18 18M6 18L18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="modal__body">
        <div class="modal__group">
          <label class="modal__label">Personalidade do ColodelBot</label>
          <div class="preset-grid" id="presetGrid">
            <button type="button" class="preset-btn" data-preset="">Padrão</button>
            <button type="button" class="preset-btn" data-preset="Seja bem-humorado e use piadas leves nas respostas.">Engraçado</button>
            <button type="button" class="preset-btn" data-preset="Seja formal, profissional e educado, evite gírias.">Formal</button>
            <button type="button" class="preset-btn" data-preset="Seja extremamente direto e objetivo, sem rodeios.">Direto</button>
            <button type="button" class="preset-btn" data-preset="Seja motivacional e encorajador, como um mentor.">Motivador</button>
          </div>
          <textarea id="personalityInput" class="modal__textarea" placeholder="Ou escreva um estilo personalizado aqui..." rows="3"></textarea>
        </div>

        <div class="modal__group">
          <div class="modal__row">
            <label class="modal__label" for="soundToggle">Som ao responder</label>
            <label class="switch">
              <input type="checkbox" id="soundToggle" checked />
              <span class="switch__track"><span class="switch__thumb"></span></span>
            </label>
          </div>
        </div>

        <div class="modal__group">
          <label class="modal__label">Memórias salvas (<span id="memoryCount">0</span>)</label>
          <p class="modal__hint">Fatos que o ColodelBot aprendeu sobre você em conversas anteriores.</p>
          <div class="memory-list" id="memoryList"></div>
          <button class="link-btn" id="clearMemoryButton">Apagar todas as memórias</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== MENU DE CONTEXTO ===================== -->
  <div class="context-menu" id="contextMenu" hidden>
    <button data-action="rename">Renomear</button>
    <button data-action="pin">Fixar</button>
    <button data-action="duplicate">Duplicar</button>
    <button data-action="export">Exportar (.md)</button>
    <button data-action="delete" class="context-menu__danger">Excluir</button>
  </div>

  <!-- ===================== TOASTS ===================== -->
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script src="js/script.js"></script>
</body>
</html>
